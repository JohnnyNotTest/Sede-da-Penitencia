<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A sequidão da Penitência 🩸</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #2b0000 0%, #0a0000 60%, #000000 100%);
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #f0e0e0;
    padding: 20px;
  }

  .container {
    background: linear-gradient(160deg, rgba(30,0,0,0.85), rgba(10,0,0,0.9));
    border: 1px solid #6b0f1a;
    border-radius: 16px;
    padding: 40px 30px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 0 40px rgba(139, 0, 0, 0.4), inset 0 0 60px rgba(80,0,0,0.3);
    text-align: center;
  }

  h1 {
    font-size: 1.8em;
    color: #ff4d4d;
    text-shadow: 0 0 12px rgba(255,0,0,0.6);
    margin-bottom: 5px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 1.1em;
    color: #d9a5a5;
    margin-bottom: 30px;
    font-style: italic;
  }

  .timer-box {
    background: rgba(0,0,0,0.4);
    border: 1px solid #4a0000;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 25px;
  }

  .timer-label {
    font-size: 0.85em;
    color: #b57373;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  #countdown {
    font-size: 2.1em;
    font-weight: bold;
    color: #ff6666;
    text-shadow: 0 0 15px rgba(255,50,50,0.7);
    letter-spacing: 2px;
  }

  #status {
    margin-top: 8px;
    font-size: 0.95em;
    color: #ffb3b3;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }

  button.food {
    background: linear-gradient(135deg, #4a0000, #7a0f0f);
    border: 1px solid #ff3333;
    color: #fff0f0;
    padding: 14px 16px;
    font-size: 1em;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s, box-shadow 0.15s;
    text-align: left;
  }

  button.food:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 4px 20px rgba(255,0,0,0.5);
    background: linear-gradient(135deg, #6a0000, #a01515);
  }

  button.food b { color: #ffcccc; display: block; font-size: 1.05em; }
  button.food span { font-size: 0.85em; color: #d9a5a5; }

  .scoreboard {
    border-top: 1px solid #4a0000;
    padding-top: 20px;
    text-align: left;
  }

  .scoreboard h2 {
    font-size: 1em;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ff8080;
    margin-bottom: 12px;
    text-align: center;
  }

  .score-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 4px;
    font-size: 0.95em;
    border-bottom: 1px dashed #3a0000;
  }

  .score-row span:first-child { color: #d9a5a5; }
  .score-row span:last-child { color: #ff9999; font-weight: bold; }

  .reset-btn {
    margin-top: 18px;
    background: none;
    border: 1px solid #5a5a5a;
    color: #999;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.8em;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
  }

  .reset-btn:hover { border-color: #ff6666; color: #ff9999; }
</style>
</head>
<body>

<div class="container">
  <h1>Contador de Sede</h1>
  <p class="subtitle">Abata incólume o indigno que ousaria te flagelar</p>

  <div class="timer-box">
    <div class="timer-label">Tempo até precisar beber sangue</div>
    <div id="countdown">--:--:--:--</div>
    <div id="status">Ainda não se alimentou</div>
  </div>

  <div class="buttons">
    <button class="food" onclick="alimentar(1, 'Villager')">
      <b>🌾 Villager</b>
      <span>Mata a sede do dia — dura 1 dia</span>
    </button>
    <button class="food" onclick="alimentar(2, 'Pet de alguém')">
      <b>🐾 Pet de alguém</b>
      <span>Se sacia mais — dura 2 dias</span>
    </button>
    <button class="food" onclick="alimentar(7, 'Players')">
      <b>⚔️ Players</b>
      <span>A mais pura sede — dura 1 semana</span>
    </button>
  </div>

  <div class="scoreboard">
    <h2>Placar de Alimentação</h2>
    <div class="score-row"><span>‍🌾 Villagers</span><span id="count-villager">0</span></div>
    <div class="score-row"><span>🐾 Pets</span><span id="count-pet">0</span></div>
    <div class="score-row"><span>⚔️ Players</span><span id="count-player">0</span></div>
    <div class="score-row"><span>🩸 Total de vezes</span><span id="count-total">0</span></div>
    <button class="reset-btn" onclick="resetarPlacar()">Zerar placar</button>
  </div>
</div>

<script>
  // Cole a sua URL do Webhook do Discord entre as aspas abaixo
  const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1553508090744283286/ZWUjSEmdBCuvtCKvNdeXNFB_HaYLY09UGgpCnt2a7LYwXVlMNl_a0LLXjrGIxd0_BEFI";

  const STORAGE_KEY = "vampiroContador";

  function carregarDados() {
    const dados = localStorage.getItem(STORAGE_KEY);
    if (dados) return JSON.parse(dados);
    return {
      expiraEm: null,
      contagem: { villager: 0, pet: 0, player: 0 }
    };
  }

  function salvarDados(dados) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
  }

  let dados = carregarDados();

  function enviarNotificacaoDiscord(tipo, dias) {
    if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("SUA_URL")) return;

    const payload = {
      content: `🩸 **Nova Alimentação Registrada!**\n- **Tipo:** ${tipo}\n- **Duração adicionada:** ${dias} dia(s)\n- **Placar Atual:** Villagers: ${dados.contagem.villager} | Pets: ${dados.contagem.pet} | Players: ${dados.contagem.player}`
    };

    fetch(DISCORD_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(err => console.error("Erro ao enviar webhook:", err));
  }

  function alimentar(dias, tipo) {
    const agora = new Date();
    const expira = new Date(agora.getTime() + dias * 24 * 60 * 60 * 1000);
    dados.expiraEm = expira.getTime();

    if (tipo === 'Villager') dados.contagem.villager++;
    if (tipo === 'Pet de alguém') dados.contagem.pet++;
    if (tipo === 'Players') dados.contagem.player++;

    salvarDados(dados);
    atualizarPlacar();
    atualizarContador();

    // Envia o aviso para você no Discord
    enviarNotificacaoDiscord(tipo, dias);
  }

  function atualizarPlacar() {
    document.getElementById('count-villager').textContent = dados.contagem.villager;
    document.getElementById('count-pet').textContent = dados.contagem.pet;
    document.getElementById('count-player').textContent = dados.contagem.player;
    document.getElementById('count-total').textContent =
      dados.contagem.villager + dados.contagem.pet + dados.contagem.player;
  }

  function resetarPlacar() {
    if (!confirm('Zerar todo o placar de alimentação?')) return;
    dados = { expiraEm: null, contagem: { villager: 0, pet: 0, player: 0 } };
    salvarDados(dados);
    atualizarPlacar();
    atualizarContador();
  }

  function atualizarContador() {
    const countdownEl = document.getElementById('countdown');
    const statusEl = document.getElementById('status');

    if (!dados.expiraEm) {
      countdownEl.textContent = "--:--:--:--";
      statusEl.textContent = "Ainda não se alimentou";
      statusEl.style.color = "#ffb3b3";
      return;
    }

    const agora = new Date().getTime();
    const restante = dados.expiraEm - agora;

    if (restante <= 0) {
      countdownEl.textContent = "00:00:00:00";
      statusEl.textContent = "🩸 SEDE! Precisa beber sangue agora!";
      statusEl.style.color = "#ff2222";
      return;
    }

    const dias = Math.floor(restante / (1000 * 60 * 60 * 24));
    const horas = Math.floor((restante % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutos = Math.floor((restante % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((restante % (1000 * 60)) / 1000);

    countdownEl.textContent =
      String(dias).padStart(2, '0') + "d : " +
      String(horas).padStart(2, '0') + "h : " +
      String(minutos).padStart(2, '0') + "m : " +
      String(segundos).padStart(2, '0') + "s";

    statusEl.textContent = "Saciada — aguentando bem";
    statusEl.style.color = "#ffb3b3";
  }

  atualizarPlacar();
  atualizarContador();
  setInterval(atualizarContador, 1000);
</script>

</body>
</html>
